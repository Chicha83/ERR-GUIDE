<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire Rome Rising (ERR)</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#12151c; --card:#171b24; --card2:#1d2230; --border:#2a3042;
  --gold:#f5c542; --gold-d:#c99a1c; --text:#e8e9ee; --muted:#9aa0b4;
  --note-bg:rgba(154,160,180,.10); --strat-bg:rgba(80,170,255,.10); --strat:#7cc0ff;
  --limit-bg:rgba(245,197,66,.12); --rem-bg:rgba(80,200,140,.12); --rem:#6fe0a8;
  --warn-bg:rgba(255,80,80,.13); --warn:#ff7b7b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1f2e 0,var(--bg) 60%);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Arabic",sans-serif;line-height:1.55;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(11,13,18,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--gold-d);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-weight:800;color:var(--gold);letter-spacing:.5px;font-size:1.1rem}
.langbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langbox .lbl{color:var(--muted);font-size:.85rem}
.langbtn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem;font-family:inherit;transition:.15s}
.langbtn:hover{border-color:var(--gold)}
.langbtn.active{background:var(--gold);color:#16130a;border-color:var(--gold);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
h1{color:var(--gold);font-size:clamp(1.7rem,4vw,2.5rem);text-align:center;text-shadow:0 0 24px rgba(245,197,66,.25)}
.sub{text-align:center;color:var(--muted);margin:6px 0 28px;font-size:1.05rem}
h2.phase{color:var(--gold);font-size:1.4rem;margin:38px 0 18px;padding-bottom:8px;border-bottom:2px solid var(--gold-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.day{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.dayhead{background:linear-gradient(135deg,var(--card2),#242a3b);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--gold-d)}
.dayhead .dn{color:var(--gold);font-weight:800;font-size:1.15rem}
.dayhead .wd{color:var(--muted);font-size:.9rem}
.events{padding:12px;display:flex;flex-direction:column;gap:10px}
.ev{background:var(--bg2);border:1px solid var(--border);border-inline-start:3px solid var(--gold);border-radius:10px;padding:10px 12px}
.evtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.evleft{display:flex;align-items:center;gap:10px;min-width:0}
.evicon{width:52px;height:52px;border-radius:50%;flex:none;background-size:cover;background-position:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

.evname{font-weight:700;color:#fff}
.badge{background:var(--gold);color:#16130a;font-weight:800;font-size:.72rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.short{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.desc{color:#cfd2de;font-size:.93rem}
.tag{display:block;margin-top:7px;padding:6px 9px;border-radius:7px;font-size:.86rem}
.tag b{margin-inline-end:4px}
.note{background:var(--note-bg);color:var(--muted)}
.strat{background:var(--strat-bg);color:var(--strat)}
.limit{background:var(--limit-bg);color:var(--gold);font-weight:600}
.rem{background:var(--rem-bg);color:var(--rem)}
.warn{background:var(--warn-bg);color:var(--warn)}
.livebtn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.livebtn:hover{border-color:#ff5a5a}
.livebtn.on{border-color:#ff5a5a;color:#ff8a8a;font-weight:700}
.livebtn .dot,.livehead .dot{width:9px;height:9px;border-radius:50%;background:#ff4040;box-shadow:0 0 0 0 rgba(255,64,64,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,64,64,.6)}70%{box-shadow:0 0 0 8px rgba(255,64,64,0)}100%{box-shadow:0 0 0 0 rgba(255,64,64,0)}}
.hdr-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.livebox{background:linear-gradient(135deg,#1d1519,#171b24);border:1px solid #ff5a5a;border-radius:14px;padding:14px 16px;margin:0 0 26px;box-shadow:0 0 28px rgba(255,64,64,.12)}
.livebox[hidden]{display:none}
.livehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.livehead b{color:#ff8a8a;font-size:1.1rem;letter-spacing:.3px}
.livehead .clock{color:var(--muted);font-size:.88rem}
.livehead .dayinfo{margin-inline-start:auto;color:var(--gold);font-weight:800}
.livelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.lrow{background:var(--bg2);border:1px solid var(--border);border-inline-start:3px solid #ff4040;border-radius:10px;padding:9px 11px}
.lrow.soon{border-inline-start-color:var(--gold);opacity:.95}
.lrow.done{border-inline-start-color:var(--border);opacity:.55}
.lrow .evicon{width:40px;height:40px}
.lrow .evtop{margin-bottom:2px}
.lstat{margin-top:6px;font-size:.9rem;font-weight:700;color:#ff8a8a}
.lrow.soon .lstat{color:var(--gold)}
.lrow.done .lstat{color:var(--muted);font-weight:500}
.lstat bdi{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
.lsec{grid-column:1/-1;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.tag.span{background:rgba(245,197,66,.10);color:var(--gold);font-weight:600}
.slots{margin-top:8px;display:grid;gap:5px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.86rem;padding:5px 9px;border-radius:7px;background:var(--note-bg);color:var(--muted)}
.slot .srange{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--text)}
.slot.live{background:rgba(255,64,64,.14);color:#ff8a8a;font-weight:700}
.slot.next{background:var(--limit-bg);color:var(--gold);font-weight:700}
.slot.later{color:var(--strat)}
.slot.done{opacity:.5}
.slot bdi{font-variant-numeric:tabular-nums}
.lrow.prep{border-inline-start-color:var(--strat)}
.lrow.prep .lstat{color:var(--strat)}
.lsec.prepsec{color:var(--strat);font-weight:700;margin-top:10px}
.todaytag.tmr{background:var(--strat);color:#06223a}
.day.today{border-color:#ff5a5a;box-shadow:0 0 0 1px #ff5a5a,0 0 24px rgba(255,64,64,.2)}
.todaytag{background:#ff4040;color:#fff;font-weight:800;font-size:.7rem;padding:2px 8px;border-radius:999px;margin-inline-start:8px}

.beast .pic .lv{position:absolute;top:10px;inset-inline-start:12px;background:rgba(0,0,0,.6);color:var(--gold);font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--gold-d)}
.beast .left{align-self:start;min-width:0}
.btnfig{margin:0;padding:10px 10px 6px;background:#0f1116;border-top:1px solid var(--border);border-end-end-radius:14px}
.btnfig img{display:block;width:100%;height:auto;border-radius:8px}
.btnmarks{position:relative;height:42px;margin-top:6px;direction:ltr}
.btnmarks span{position:absolute;top:0;transform:translateX(-50%);width:31%;text-align:center;font-size:.74rem;font-weight:800;line-height:1.2}
.btnmarks .ok{color:var(--rem)}
.btnmarks .no{color:var(--warn)}
.beast .body{padding:18px 20px}
.beast h2{color:var(--gold);font-size:1.35rem;margin-bottom:4px}
.beast .lead{color:#cfd2de;margin-bottom:14px}
.bsteps{list-style:none;display:grid;gap:10px;margin-bottom:14px}
.bsteps li{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.bsteps .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#16130a;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.bsteps b{color:#fff}
.bsteps span.t{color:#cfd2de;font-size:.93rem;display:block}
.bars{display:grid;gap:8px;margin:0 0 14px}
.bar{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.bar .track{height:20px;border-radius:5px;background:#0d0f14;border:1px solid var(--border);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar .fill.g{background:linear-gradient(#4ec24e,#1f7a1f)}
.bar .fill.r{background:linear-gradient(#e04040,#8a1515)}
.bar .val{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:700;text-shadow:0 1px 2px #000}
.bar .ex{color:var(--muted);font-size:.72rem}
.brew{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.brew .tag{margin:0}
.phase-sys{color:var(--gold);font-size:1.4rem;margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid var(--gold-d)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
.halbtn{background:linear-gradient(135deg,#3a1d08,#1d1210);color:#ffb45a;border:1px solid #ff8a1f;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem;font-family:inherit;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.halbtn:hover{box-shadow:0 0 14px rgba(255,138,31,.45);transform:translateY(-1px)}
.halmodal{position:fixed;inset:0;z-index:100;background:rgba(5,6,10,.82);overflow-y:auto;padding:18px 12px;-webkit-overflow-scrolling:touch}
.halmodal[hidden]{display:none}

.halhero-in{padding:20px 22px;width:100%}
.halhero h2{color:#ffb45a;font-size:clamp(1.5rem,4vw,2.2rem);text-shadow:0 2px 14px #000}
.hsub{color:#ffd9a8;font-size:.85rem;letter-spacing:.5px;text-transform:uppercase}
.hdate{color:#f2e6d6;margin-top:6px;font-size:.95rem}
.hcount{display:inline-block;margin-top:10px;background:rgba(0,0,0,.55);border:1px solid #ff8a1f;color:#ffcf8f;padding:6px 12px;border-radius:999px;font-weight:700}
.hsec{color:#ffb45a;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid #8a4a10;font-size:1.2rem}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.hcard{background:var(--bg2);border:1px solid var(--border);border-inline-start:3px solid #ff8a1f;border-radius:10px;padding:12px 14px}
.hcard h4{color:#fff;margin-bottom:6px;font-size:1.02rem}
.hlab{color:var(--muted);font-size:.8rem;text-transform:uppercase;margin:4px 0}
.hlist{margin:0 0 4px;padding-inline-start:18px;color:#cfd2de;font-size:.92rem}
.hstats{list-style:none;margin:0;padding:0}
.hstats li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #2a3040;font-size:.9rem;color:#cfd2de}
.hstats li:last-child{border-bottom:0}
.hstats .sv{color:#ffb45a;font-weight:800;white-space:nowrap}
.gembtn{background:linear-gradient(135deg,#0f2a3a,#14161f);color:#7fd4ff;border:1px solid #3aa7e0;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem;font-family:inherit;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.gembtn:hover{box-shadow:0 0 14px rgba(58,167,224,.45);transform:translateY(-1px)}
.ghero{background:linear-gradient(135deg,#0f2a3a,#1a1530);min-height:0}
.ghero h2{color:#7fd4ff}
.gctl{margin:14px 0 4px}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.gchip{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.88rem;font-family:inherit}
.gchip.on{background:#3aa7e0;color:#06131c;border-color:#3aa7e0;font-weight:700}
.gadv{margin:6px 0 4px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.gadv summary{cursor:pointer;color:var(--gold);font-weight:700}
.gsmall{font-size:.82rem;color:var(--muted)}
.gnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
.gnum{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.gnum input[type=number]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:inherit;width:100%}
.gnum.gchk{flex-direction:row;align-items:center;gap:8px}
.gtabs{display:flex;gap:6px;margin:14px 0 10px;border-bottom:2px solid #1d4a63;flex-wrap:wrap}
.gtab{background:transparent;color:var(--muted);border:0;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.gtab.on{color:#7fd4ff;border-bottom-color:#3aa7e0}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
.gtools input[type=search]{flex:1 1 160px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:inherit}
.gown{margin-inline-start:auto;color:var(--muted);font-size:.85rem}
.gico{width:46px;height:46px;border-radius:8px;flex:0 0 46px;background:#10131c;object-fit:cover;vertical-align:middle;margin-inline-end:8px}.desc .gico{width:26px;height:26px;flex:none;margin:0 4px 0 2px;vertical-align:middle;border-radius:5px}.grow>.gico{margin-inline-end:0}.grow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #232a3a}
.gname{display:flex;flex-direction:column;min-width:0;flex:1}
.gname b{color:#fff}
.geff{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.gstep{display:flex;align-items:center;gap:4px;flex:none}
.gstep button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.1rem;cursor:pointer}
.gstep input{width:52px;text-align:center;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 2px;font-family:inherit}
.gres{margin:0;padding-inline-start:22px}
.gres{list-style:none;padding-inline-start:0}
.gres li{padding:6px 0;border-bottom:1px dashed #2a3040;display:flex;align-items:center;gap:10px}
.gres li .gico{flex:none}
.gres li b{color:#fff}
.hsec small{color:var(--muted);font-weight:400;font-size:.8rem}
.gview{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0f2a3a;border:1px solid #3aa7e0;border-radius:10px;padding:10px 12px;margin:10px 0;color:#cfe9f7;font-size:.9rem}
.gview>span{flex:1 1 220px}
.gta{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:monospace;font-size:.8rem;resize:vertical}
.gnum input[type=text]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;width:100%;max-width:320px}
.gfile{cursor:pointer;display:inline-block}
.gshare .gchips{margin:10px 0}
.gtutl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:18px}.gtutl li p{margin:0 0 8px;font-weight:600}.gtutl img{display:block;max-width:100%;width:340px;height:auto;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
#gemRes .gg{margin-top:14px;font-size:.95em;letter-spacing:.03em}#gemRes .gh{margin-top:20px;padding:6px 10px;border-left:3px solid var(--gold,#f0b84a);background:rgba(240,184,74,.08);font-weight:700}#gemRes .hstats li.sec{opacity:.82}#gemRes .hstats li.sec.first{border-top:1px dashed rgba(255,255,255,.18);margin-top:6px;padding-top:6px}
#gemRes .htag{font-style:normal;font-size:.78em;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(240,184,74,.18);color:#f0b84a;margin-inline-start:4px;white-space:nowrap}
</style>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// [[Nombre]] = nombre de evento en francés incrustado en un texto (se aísla en LTR)
const fmt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,(m,n)=>`<bdi dir="ltr">${n}</bdi>`);

// Nombres originales del juego en francés (se usan como nombre de evento en árabe)
const FR={

 "upgrade equipment":"Mettre à niveau l'équipement","sprint":"Sprint","treasure from heaven":"Trésor du ciel",

 "training day":"Formation de jour","base construction":"Construction de base",
 "alliance base plunder":"Le pillage de la base de l'Alliance","upgrade hero":"Mettre à niveau l'héro",
 "gems merge":"Les points bijoux","strength the city":"Renforcer la Ville","quest master":"Maître de quête",
 "monster siege":"Le Siège des Monstres"
};
function evName(name,lang){
  if(lang!=="ar")return esc(name);
  const m=name.match(/^(.*?)(\s*\(4h\))?$/i);
  const fr=FR[m[1].toLowerCase()];
  if(!fr)return esc(name);
  return `<bdi dir="ltr">${esc(fr)}${m[2]?" (4h)":""}</bdi>`;
}

// Iconos de eventos (medallones del juego): imágenes incrustadas en el CSS (.ic-xx)
const ICONKEY={"killing spree":"ks","war raiders":"wr","super roulette":"sr","isw":"isw","alliance base plunder":"abp","quest master":"qm","upgrade equipment":"ue","sprint":"sp","treasure from heaven":"tfh","chip game":"cg"};
function evIcon(name){
  const k=ICONKEY[name.replace(/\s*\(4h\)$/i,"").toLowerCase()];
  return k?`<span class="evicon ic-${k}" aria-hidden="true"></span>`:"";
}

function renderDay(i,lang){
  const u=UI[lang];
  const evs=DAYS[i].map(ev=>{
    const lines=ev.lines.map(([k,key])=>{
      switch(k){
        case "t": return `<div class="desc">${fmt(T[key][lang])}</div>`;
        case "n": return `<span class="tag note"><b>${u.note}</b>${fmt(T[key][lang])}</span>`;
        case "s": return `<span class="tag strat"><b>${u.strat}</b>${fmt(T[key][lang])}</span>`;
        case "l": return `<span class="tag limit">${esc(T.limit[lang])}</span>`;
        case "r": return `<span class="tag rem"><b>${u.remT}</b><br>${fmt(T[key][lang])}</span>`;
        case "w": return `<span class="tag warn"><b>${u.warnT}</b><br>${fmt(T[key][lang])}</span>`;
      }
    }).join("");
    const si=ev.h===24?spanInfo(i,ev.name):null;
    const long=si&&si.len>1;
    const bd=`<span class="badge ${ev.h===4?"short":""}">${long?si.len*24:ev.h}${u.h}</span>`;
    return `<div class="ev"><div class="evtop"><span class="evleft">${evIcon(ev.name)}<span class="evname">${evName(ev.name,lang)}</span></span>${bd}</div>${lines}${spanTag(si,lang,false)}</div>`;
  }).join("");
  const cn=canaryNow().day, isToday=(i===cn), isTmr=(i===(cn+1)%14);
  return `<article class="day${isToday?" today":""}"><div class="dayhead"><span class="dn">${u.day} ${i+1}${isToday?`<span class="todaytag">${L[lang].today}</span>`:""}${isTmr?`<span class="todaytag tmr">${L[lang].tmr}</span>`:""}</span><span class="wd">${u.wd[i%7]}</span></div><div class="events">${evs}</div></article>`;
}

function canaryNow(){
  let y,mo,d,h,mi,s;
  try{
    const parts=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"}).formatToParts(new Date());
    const g=t=>+parts.find(p=>p.type===t).value;
    y=g("year");mo=g("month");d=g("day");h=g("hour");mi=g("minute");s=g("second");
  }catch(e){
    const n=new Date(Date.now()+3600e3); // respaldo: UTC+1
    y=n.getUTCFullYear();mo=n.getUTCMonth()+1;d=n.getUTCDate();h=n.getUTCHours();mi=n.getUTCMinutes();s=n.getUTCSeconds();
  }
  const [cy,cm,cd]=CYCLE_START.split("-").map(Number);
  const days=Math.round((Date.UTC(y,mo-1,d)-Date.UTC(cy,cm-1,cd))/864e5);
  return {day:((days%14)+14)%14, secs:h*3600+mi*60+s, h,mi,s};
}
const pad=n=>String(n).padStart(2,"0");
const hms=t=>`${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`;

/* Eventos que duran más de 24H: días consecutivos (en ciclo) con el mismo evento de 24H */
function spanInfo(d,name){
  const key=name.toLowerCase();
  const has=x=>DAYS[((x%14)+14)%14].some(e=>e.h===24&&e.name.toLowerCase()===key);
  if(!has(d))return null;
  let s=d,e=d,c=0;
  while(has(s-1)&&c<14){s--;c++}
  c=0;
  while(has(e+1)&&c<14){e++;c++}
  const len=Math.min(e-s+1,14), m=x=>((x%14)+14)%14+1;
  return {len,pos:d-s,a:m(s),b:m(e)};
}
function spanTag(si,lang,withPos){
  if(!si||si.len<2)return "";
  const l=L[lang];
  return `<span class="tag span">⏳ ${l.lasts} <bdi dir="ltr">${si.len*24}H</bdi> · ${l.days} <bdi dir="ltr">${si.a}–${si.b}</bdi>${withPos?` · <bdi dir="ltr">${si.pos+1}/${si.len}</bdi>`:""}</span>`;
}
function hmsd(t,lang){

function canaryToUtc(y,mo,d,h){
  let t=Date.UTC(y,mo-1,d,h);
  try{
    const f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"});
    for(let i=0;i<3;i++){
      const p=f.formatToParts(new Date(t)), g=k=>+p.find(x=>x.type===k).value;
      t-=Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"),g("second"))-Date.UTC(y,mo-1,d,h);
    }
  }catch(e){t-=3600e3}
  return t;
}

function halCountdown(lang){
  const t=HT[lang], now=Date.now();
  if(now<HAL_T0)return `${t.startsIn} <bdi dir="ltr">${hmsd(Math.ceil((HAL_T0-now)/1000),lang)}</bdi>`;
  if(now<HAL_T1)return `🎃 ${t.endsIn} <bdi dir="ltr">${hmsd(Math.ceil((HAL_T1-now)/1000),lang)}</bdi>`;
  return t.over;

}

function gOptRunes(w,respect){

function gtrNote(n,D){

  if(/only work in isw/i.test(n))return "("+D.isw+")";

}
function gtrClause(c,D){
  let s=c.trim();if(!s)return "";
  let note="";const nm=s.match(/\(([^)]*)\)\s*$/);

  let l=s.toLowerCase().replace(/[’']s\b/g,"s").replace(/\bunits s\b/,"units"),m;
  l=s.toLowerCase().replace(/[’']s\b/g,"").replace(/\s+/g," ").trim();
  if(l==="with marching animation")return D.marching;
  if(l==="when hero-led")return D.herow;
  if(l==="when attacking")return D.atk.replace(/:$/,"");
  if(m=l.match(/^(\d+%) chance (.+)$/)){const r=gtrClause(m[2]+note,D);return r===null?null:D.chance(m[1])+r}
  if(m=l.match(/^reduce (defense|hp|attack) bonus of (infantry|cavalry|archers?) in the enemy city by ([\d.,]+%?)$/)){
    const u=m[2][0]==="i"?"i":m[2][0]==="c"?"c":"a";return D.red(D.rb[m[1]],D.ru[u],m[3])+note}
  const vm=l.match(/([+\-]?)\s*(\d[\d.,]*)\s*([%kK]?)/);if(!vm)return null;
  const v=(vm[1]||"")+vm[2]+vm[3];
  let t=(l.slice(0,vm.index)+" "+l.slice(vm.index+vm[0].length)).replace(/\s+/g," ").replace(/\b(by)\b/,"").trim();
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  let o=null;
  ["troop number of a single attack","capture rate","treasure protection","hall of war capacity","improve soldiers treatment rate","training speed","building upgrade speed","research speed","anti-casualties","casualties","march speed","march limit","max march","hospital capacity","silver production","expedition troop number","treasury","troops load","collection speed","march"].some(k=>{if(new RegExp("(^|\\s)"+k+"(\\s|$)").test(t)){o=k;return true}});
  if(o&&!/\b(attack|defense|hp)\b/.test(t.replace(o,"")))return D.o[o]+(/hero-led/.test(t)?" Hero-led":"")+" "+v+note;
  let tg=null;
  const tm=t.match(/\b(?:against|on|to) (infantry|cavalry|archers?|monsters?)\b/);
  if(tm){tg=tm[1][0]==="m"?"m":tm[1][0];t=t.replace(tm[0]," ")}

  const hero=/\bhero-led\b/.test(t);t=t.replace(/hero-led/," ");

  const st=(sm[1]?"f":"")+sm[2];t=t.replace(sm[0]," ");
  let u=null;const um=t.match(/\b(infantry|cavalry|archers?|all units|all troops|troops|units)\b/);
  if(um){const w=um[1];u=w==="infantry"?"i":w==="cavalry"?"c":w[0]==="a"&&w!=="all units"&&w!=="all troops"?"a":"x"}
  let r=D.st[st];if(u)r+=" "+D.un[u];if(hero)r+=" "+D.hero;if(tg)r+=" "+D.tg[tg];if(city)r+=" "+D.city;
  return r+" "+v+note;
}
function gtr(e,lang){
  const D=GTRX[lang];if(!D||!e)return e||"";
  const parts=e.split(/\s*[;；，]\s*|,\s*|\s+\/\s+/).filter(x=>x.trim());
  const out=[];
  for(let i=0;i<parts.length;i++){
    let p=parts[i].trim(),m=p.match(/^for every ([\d.,]+%?) (.+?) player has$/i);
    if(m){
      const nx=gtrClause(parts[++i]||"",D),x=D.ev[m[2].toLowerCase()];
      if(nx===null||!x){out.push(p+", "+(parts[i]||""));continue}
      out.push(D.every(m[1],x)+nx);continue;
    }
    if(/^when attacking$/i.test(p)){out.push(D.atk);continue}
    const r=gtrClause(p,D);out.push(r===null?p:r);
  }
  return out.join(", ").replace(/: , /g,": ").replace(/(:), /g,"$1 ").replace(/^./,c=>c.toUpperCase());
}

function gPack(){
  const g={},r={};
  GD.gems.forEach((x,i)=>{const q=+ginv.g[x.n]||0;if(q)g[i]=q});
  GD.runes.forEach((x,i)=>{const q=+ginv.r[x.n]||0;if(q)r[i]=q});
  const o={v:1,n:ginv.name||"",g:g,r:r,t:gcfg.troop,f:gcfg.focus,h:gcfg.hero};
  const j=unescape(encodeURIComponent(JSON.stringify(o)));
  return "ERR1:"+btoa(j).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function gUnpack(code){
  try{
    code=String(code).trim();const m=code.match(/ERR1:[A-Za-z0-9_\-]+/);if(!m)return null;
    let b=m[0].slice(5).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||o.v!==1)return null;
    const inv={g:{},r:{},name:String(o.n||"").slice(0,40)};
    for(const i in o.g){const x=GD.gems[+i];if(x)inv.g[x.n]=Math.min(99,+o.g[i]||0)}
    for(const i in o.r){const x=GD.runes[+i];if(x)inv.r[x.n]=Math.min(99,+o.r[i]||0)}
    return {inv:inv,t:o.t,f:o.f,h:o.h};
  }catch(e){return null}
}

function gApplyImport(r,persist){

  ginv=r.inv;if(r.t)gcfg.troop=r.t;if(r.f)gcfg.focus=r.f;if(r.h)gcfg.hero=r.h;
  if(persist)gSave();
}
function gEnterView(r){
  if(!gView){gStash={inv:ginv,c:Object.assign({},gcfg)}}
  gView={name:r.inv.name||"?"};ginv=r.inv;if(r.t)gcfg.troop=r.t;if(r.f)gcfg.focus=r.f;if(r.h)gcfg.hero=r.h;gTab="x";
}
function gExitView(){if(gStash){ginv=gStash.inv;Object.assign(gcfg,gStash.c)}gView=null;gStash=null;gTab="g"}
function gShareHtml(lang){
  const t=GT[lang];
  let key="";try{key=localStorage.getItem(GKK)||""}catch(e){}
  return `<div class="gshare"><h3 class="hsec">${t.sendT}</h3><p class="desc gsmall">${t.sendN}</p>
  <div class="gnums"><label class="gnum"><span>${t.pname}</span><input type="text" id="gname2" maxlength="40" placeholder="${t.pnamePh}" value="${gesc(ginv.name||"")}"></label>
  <label class="gnum"><span>${t.akey}</span><input type="password" id="gkey" autocomplete="off" value="${gesc(key)}"></label></div>
  <div class="gchips"><button type="button" class="gchip on" id="gxSend">${t.sendBtn}</button><span class="gown" id="gxSendMsg"></span></div>
  <h3 class="hsec">${t.shareT}</h3><p class="desc gsmall">${t.shareN}</p>
  <label class="gnum"><span>${t.pname}</span><input type="text" id="gname" maxlength="40" placeholder="${t.pnamePh}" value="${gesc(ginv.name||"")}"></label>
  <div class="gchips"><button type="button" class="gchip" id="gxCode">${t.cCode}</button><button type="button" class="gchip" id="gxLink">${t.cLink}</button><button type="button" class="gchip" id="gxText">${t.cText}</button><button type="button" class="gchip" id="gxFile">${t.dl}</button></div>
  <textarea id="gxOut" class="gta" readonly rows="3"></textarea>
  <h3 class="hsec">${t.impT}</h3><textarea id="gxIn" class="gta" rows="3" placeholder="${t.impPh}"></textarea>
  <div class="gchips"><button type="button" class="gchip on" id="gxImp">${t.impBtn}</button><label class="gchip gfile">${t.impFile}<input type="file" id="gxF" accept=".json,.txt" hidden></label><span class="gown" id="gxMsg"></span></div></div>`;
}
function gRows(list,inv,lang){
  const t=GT[lang];
  return list.map(g=>`<div class="grow" data-n="${gesc(g.n)}">${gico(g.n)}<div class="gname"><b><bdi dir="ltr">${gesc(g.n)}</bdi></b><span class="geff"><bdi dir="${lang==="ar"?"rtl":"ltr"}">${g.e?gesc(gtr(g.e,lang)):t.unk}</bdi></span></div>
    <div class="gstep"><button type="button" data-d="-1" aria-label="-">−</button><input type="number" min="0" max="99" inputmode="numeric" value="${+inv[g.n]||0}"><button type="button" data-d="1" aria-label="+">+</button></div></div>`).join("");
}
function gFilterRows(){
  const q=gQuery.toLowerCase(),box=document.getElementById("gemList");if(!box)return;
  const inv=gTab==="g"?ginv.g:ginv.r;
  box.querySelectorAll(".grow").forEach(el=>{
    const n=el.dataset.n,hit=!q||n.toLowerCase().indexOf(q)>=0||el.textContent.toLowerCase().indexOf(q)>=0;
    const own=gFilter==="all"||(+inv[n]||0)>0;
    el.style.display=hit&&own?"":"none";
  });
}
function gTotals(){
  const t=GT[curLang],el=document.getElementById("gemOwned");if(!el)return;
  const inv=gTab==="g"?ginv.g:ginv.r;let s=0;for(const k in inv)s+=+inv[k]||0;el.textContent=t.owned+" "+s;
}

function gTutHtml(t){
  const st=[[t.tut1,"t1"],[t.tut2,"t2"],[t.tut3,"t3"],[t.tut4,"t4"]];
  return `<details class="gadv gtut"><summary>${t.tutT}</summary><p class="desc gsmall">${t.tutN}</p><ol class="gtutl">${st.map(x=>`<li><p>${x[0]}</p><img src="${GTUT[x[1]]}" alt="" loading="lazy"></li>`).join("")}</ol></details>`;
}
function gHtml(lang){
  const t=GT[lang],c=gcfg;
  const chip=(grp,val,label,cur)=>`<button type="button" class="gchip${cur===val?" on":""}" data-grp="${grp}" data-val="${val}">${label}</button>`;
  const num=(id,label,v,step)=>`<label class="gnum"><span>${label}</span><input type="number" id="${id}" value="${v}" step="${step||"any"}" min="0"></label>`;
  let h=(gView?`<div class="gview"><span>${t.viewing} <b><bdi dir="ltr">${gesc(gView.name)}</bdi></b>. ${t.viewN}</span><button type="button" class="gchip on" id="gvSave">${t.saveMine}</button><button type="button" class="gchip" id="gvExit">${t.exitV}</button></div>`:"")+`<div class="halhero ghero"><div class="halhero-in"><span class="hsub">${t.sub}</span><h2>💎 ${t.title}</h2><div class="hdate">${t.intro}</div></div></div>
  <div class="gctl"><div class="hlab">${t.troop}</div><div class="gchips">${chip("troop","i",t.inf,c.troop)}${chip("troop","c",t.cav,c.troop)}${chip("troop","a",t.arc,c.troop)}${chip("troop","all",t.all,c.troop)}</div>
  <div class="hlab">${t.focus}</div><div class="gchips">${chip("focus","attack",t.fAtk,c.focus)}${chip("focus","def",t.fDef,c.focus)}${chip("focus","bal",t.fBal,c.focus)}</div>
  <div class="hlab">${t.hero}</div><div class="gchips">${chip("hero","n",t.heroN,c.hero)}${chip("hero","y",t.heroY,c.hero)}</div>
  <p class="desc gsmall">${t.heroNote}</p>
  </div>
  <div class="gtabs"><button type="button" class="gtab${gTab==="g"?" on":""}" data-tab="g">${t.tabG}</button><button type="button" class="gtab${gTab==="r"?" on":""}" data-tab="r">${t.tabR}</button><button type="button" class="gtab${gTab==="x"?" on":""}" data-tab="x">${t.tabX}</button><button type="button" class="gtab${gTab==="s"?" on":""}" data-tab="s">${t.tabS}</button></div>`;
  if(gTab==="x")h+=`<div id="gemRes">${gResultHtml(lang)}</div>`;
  else if(gTab==="s")h+=gShareHtml(lang);
  else{
    const list=gTab==="g"?GD.gems:GD.runes,inv=gTab==="g"?ginv.g:ginv.r;
    h+=gTab==="g"?gTutHtml(t):"";
    h+=`<div class="gtools"><input type="search" id="gemQ" placeholder="${t.search}" value="${gesc(gQuery)}"><button type="button" class="gchip${gFilter==="all"?" on":""}" data-flt="all">${t.fAll}</button><button type="button" class="gchip${gFilter==="own"?" on":""}" data-flt="own">${t.fOwn}</button><button type="button" class="gchip" id="gemOne">${t.one}</button><button type="button" class="gchip" id="gemZero">${t.zero}</button><span class="gown" id="gemOwned"></span></div>
    <div id="gemList">${gRows(list,inv,lang)}</div>`;
  }
  return h;
}
function gRender(){
  const m=document.getElementById("gemModal"),sc=m.scrollTop;
  document.getElementById("gemBody").innerHTML=gHtml(curLang);
  document.getElementById("gemClose").setAttribute("aria-label",GT[curLang].close);
  gFilterRows();gTotals();m.scrollTop=sc;
}
function gShow(on){
  const m=document.getElementById("gemModal");gOpen=on;m.hidden=!on;
  document.body.style.overflow=on?"hidden":"";
  if(on){gRender();m.scrollTop=0;document.getElementById("gemClose").focus()}else document.getElementById("gemBtn").focus();
}
function gLabel(){document.getElementById("gemBtnTxt").textContent=GT[curLang].btn}
function gInit(){
  document.getElementById("gemBtn").addEventListener("click",()=>gShow(true));
  document.getElementById("gemClose").addEventListener("click",()=>gShow(false));
  const m=document.getElementById("gemModal");
  m.addEventListener("click",e=>{
    if(e.target.id==="gemModal"){gShow(false);return}
    const b=e.target.closest("button");if(!b)return;
    if(b.id==="gvSave"){gApplyImport({inv:ginv},true);gTab="g";gRender();return}
    if(b.id==="gvExit"){gExitView();gRender();return}
    if(b.id==="gxSend"){gSend();return}
    if(b.id==="gxCode"||b.id==="gxLink"||b.id==="gxText"){const txt=b.id==="gxCode"?gPack():b.id==="gxLink"?gLink():gText();const o=document.getElementById("gxOut");o.value=txt;gCopy(txt,b);return}
    if(b.id==="gxFile"){const code=gPack(),blob=new Blob([JSON.stringify({game:"ERR",player:ginv.name||"",code:code,text:gText()},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ERR_"+((ginv.name||"jugador").replace(/[^\w\-]+/g,"_"))+".json";document.body.appendChild(a);a.click();a.remove();return}
    if(b.id==="gxImp"){const r=gUnpack(document.getElementById("gxIn").value),msg=document.getElementById("gxMsg");if(!r){msg.textContent=GT[curLang].bad;return}gApplyImport(r,true);gRender();document.getElementById("gxMsg").textContent="✓ "+GT[curLang].done;return}
    if(b.dataset.grp){gcfg[b.dataset.grp]=b.dataset.val;gSave();gRender();return}
    if(b.dataset.tab){gTab=b.dataset.tab;gFilter="all";gQuery="";gRender();m.scrollTop=0;return}
    if(b.dataset.flt){gFilter=b.dataset.flt;gRender();return}
    if(b.id==="gemZero"){const inv=gTab==="g"?ginv.g:ginv.r;Object.keys(inv).forEach(k=>delete inv[k]);gSave();gRender();return}
    if(b.id==="gemOne"){const inv=gTab==="g"?ginv.g:ginv.r,list=gTab==="g"?GD.gems:GD.runes;list.forEach(x=>{inv[x.n]=1});gSave();gRender();return}
    if(b.dataset.d){
      const row=b.closest(".grow"),inp=row.querySelector("input"),inv=gTab==="g"?ginv.g:ginv.r;
      const v=Math.max(0,Math.min(99,(+inp.value||0)+(+b.dataset.d)));inp.value=v;
      if(v)inv[row.dataset.n]=v;else delete inv[row.dataset.n];gSave();gTotals();
    }
  });
  m.addEventListener("input",e=>{
    const el=e.target;
    if(el.id==="gname"||el.id==="gname2"){ginv.name=el.value.slice(0,40);gSave();return}
    if(el.id==="gkey"){try{localStorage.setItem(GKK,el.value)}catch(e){}return}
    if(el.id==="gemQ"){gQuery=el.value;gFilterRows();return}
    if(el.closest(".grow")&&el.type==="number"){
      const row=el.closest(".grow"),inv=gTab==="g"?ginv.g:ginv.r,v=Math.max(0,Math.min(99,Math.floor(+el.value||0)));
      if(v)inv[row.dataset.n]=v;else delete inv[row.dataset.n];gSave();gTotals();return}
    const map={gc_fin:"fin",gc_vs:"vs",gc_city:"city",gc_cas:"cas",gc_acas:"acas",gc_march:"march",gc_ms:"ms",gc_maxc:"maxc",gc_ecas:"ecas",gc_eacas:"eacas"};
    if(map[el.id]){const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){gcfg[map[el.id]]=v;gSave()}}
    if(el.id==="gc_resp"){gcfg.resp=el.checked;gSave()}
  });
  m.addEventListener("change",e=>{
    if(e.target.id==="gxF"&&e.target.files[0]){const f=e.target.files[0],rd=new FileReader();rd.onload=()=>{document.getElementById("gxIn").value=String(rd.result);document.getElementById("gxImp").click()};rd.readAsText(f)}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&gOpen)gShow(false)});
  const h=location.hash.match(/inv=(ERR1:[A-Za-z0-9_\-]+)/);
  if(h){const r=gUnpack(h[1]);if(r){gEnterView(r);gShow(true)}}
}


function liveRow(ev,lang,state,secs,custom,dayIdx,slots){
  const l=L[lang], u=UI[lang];
  const desc=ev.lines.filter(([k])=>!(state==="prep"&&(k==="r"||k==="w"))).map(([k,key])=>{
    switch(k){
      case "t": return `<div class="desc">${fmt(T[key][lang])}</div>`;
      case "n": return `<span class="tag note"><b>${u.note}</b>${fmt(T[key][lang])}</span>`;
      case "s": return `<span class="tag strat"><b>${u.strat}</b>${fmt(T[key][lang])}</span>`;
      case "l": return `<span class="tag limit">${fmt(T.limit[lang])}</span>`;
      case "r": return `<span class="tag rem"><b>${u.remT}</b><br>${fmt(T[key][lang])}</span>`;
      case "w": return `<span class="tag warn"><b>${u.warnT}</b><br>${fmt(T[key][lang])}</span>`;
    }
  }).join("");
  const si=(ev.h===24&&dayIdx!=null)?spanInfo(dayIdx,ev.name):null;
  const long=si&&si.len>1;
  const bd=`<span class="badge ${ev.h===4?"short":""}">${long?si.len*24:ev.h}${u.h}</span>`;
  let stat;
  if(state==="live"){
    if(long)secs=(si.len-si.pos)*86400-(86400-secs);   // hasta el final del último día del evento
    stat=`${l.ends} <bdi dir="ltr">${hmsd(secs,lang)}</bdi>`;
  }
  else if(state==="soon")stat=`${l.starts} <bdi dir="ltr">${hms(secs)}</bdi>`;
  else if(state==="prep")stat=(long&&si.pos>0)?l.cont:(custom||`${l.starts} <bdi dir="ltr">${hms(secs)}</bdi>`);
  else stat=l.done;
  return `<div class="lrow ${state==="live"?"":state}"><div class="evtop"><span class="evleft">${evIcon(ev.name)}<span class="evname">${evName(ev.name,lang)}</span></span>${bd}</div>${desc}${spanTag(si,lang,state==="live")}${slots!==undefined?`<div class="slots">${slots}</div>`:`<div class="lstat">${stat}</div>`}</div>`;
}

function renderLive(){
  const box=document.getElementById("live");
  if(!liveOn){box.hidden=true;return}
  box.hidden=false;
  const lang=curLang, l=L[lang], u=UI[lang];
  const n=canaryNow();
  if(n.day!==shownDay){renderAll(lang);return}   // cambio de día
  const evs=DAYS[n.day];
  const rows24=evs.filter(e=>e.h===24).map(e=>liveRow(e,lang,"live",86400-n.secs,undefined,n.day)).join("");
  let rows4="";
  for(const e of evs.filter(e=>e.h===4)){
    let rowState="done",slots="",nextFound=false;
    const ft=x=>pad(x%24)+":00";
    for(const st of H4){
      const a=st*3600,b=a+DUR4*3600, rng=`${ft(st)}–${ft(st+DUR4)}`;
      let cls,txt;
      if(n.secs>=b){cls="done";txt=l.fin}
      else if(n.secs>=a){cls="live";txt=`${l.btn} · ${l.ends} <bdi dir="ltr">${hms(b-n.secs)}</bdi>`;rowState="live"}
      else if(!nextFound){cls="next";nextFound=true;txt=`${l.starts} <bdi dir="ltr">${hms(a-n.secs)}</bdi>`;if(rowState!=="live")rowState="soon"}
      else{cls="later";txt=`${l.sat} <bdi dir="ltr">${ft(st)}</bdi>`;if(rowState!=="live")rowState="soon"}
      slots+=`<div class="slot ${cls}"><bdi dir="ltr" class="srange">${rng}</bdi><span>${txt}</span></div>`;
    }
    rows4+=liveRow(e,lang,rowState,0,undefined,n.day,slots);
  }
  const nd=(n.day+1)%14, evsT=DAYS[nd];
  const h4txt=H4.map(x=>pad(x)+":00").join(" · ");
  const prep=evsT.map(e=>e.h===24
    ?liveRow(e,lang,"prep",86400-n.secs,undefined,nd)
    :liveRow(e,lang,"prep",0,undefined,nd,H4.map((st,i)=>{
        const t=86400-n.secs+st*3600, ft=x=>pad(x%24)+":00";
        return `<div class="slot ${i===0?"next":"later"}"><bdi dir="ltr" class="srange">${ft(st)}–${ft(st+DUR4)}</bdi><span>${l.starts} <bdi dir="ltr">${hmsd(t,lang)}</bdi></span></div>`;
      }).join(""))).join("");
  box.innerHTML=`<div class="livehead"><span class="dot"></span><b>${l.title}</b><span class="clock">${l.clock}: <bdi dir="ltr">${pad(n.h)}:${pad(n.mi)}:${pad(n.s)}</bdi></span><span class="dayinfo">${u.day} ${n.day+1}</span></div>
  <div class="livelist">${rows24?`<div class="lsec">${l.s24}</div>${rows24}`:""}${rows4?`<div class="lsec">${l.s4}</div>${rows4}`:""}<div class="lsec prepsec">${l.prep} · ${u.day} ${nd+1}</div>${prep}</div>`;
}

let shownDay=-1, liveTimer=null;
function renderAll(lang){
  curLang=lang;
  shownDay=canaryNow().day;
  render(lang);
  const b=document.getElementById("liveBtn");
  document.getElementById("liveBtnTxt").textContent=L[lang].btn;
  b.classList.toggle("on",liveOn);b.setAttribute("aria-pressed",liveOn);
  renderLive();
  halLabel();if(halOpen)halRender();
  gLabel();if(gOpen)gRender();
}

function render(lang){
  const u=UI[lang];
  document.documentElement.lang=lang==="fil"?"fil":lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=u.title;
  document.getElementById("title").textContent=u.title;
  document.getElementById("sub").textContent=u.sub;
  document.getElementById("langLabel").textContent=u.lang;
  document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active",b.dataset.l===lang));
  let html=beastHtml(lang)+`<h2 class="phase">${u.p1}</h2><div class="grid">`;
  for(let i=0;i<7;i++)html+=renderDay(i,lang);
  html+=`</div><h2 class="phase">${u.p2}</h2><div class="grid">`;
  for(let i=7;i<14;i++)html+=renderDay(i,lang);
  html+=`</div>`;
  document.getElementById("content").innerHTML=html;
  try{localStorage.setItem("err_lang",lang)}catch(e){}
}

const box=document.getElementById("langs");
LANGS.forEach(([c,n])=>{
  const b=document.createElement("button");
  b.className="langbtn";b.dataset.l=c;b.textContent=n;
  b.addEventListener("click",()=>renderAll(c));
  box.appendChild(b);
});
let start="es";
try{const s=localStorage.getItem("err_lang");if(s&&UI[s])start=s}catch(e){}
try{liveOn=localStorage.getItem("err_live")!=="0"}catch(e){}
document.getElementById("liveBtn").addEventListener("click",()=>{
  liveOn=!liveOn;
  try{localStorage.setItem("err_live",liveOn?"1":"0")}catch(e){}
  renderAll(curLang);
});
renderAll(start);
liveTimer=setInterval(renderLive,1000);
gInit();
document.getElementById("halBtn").addEventListener("click",()=>halShow(true));
document.getElementById("halClose").addEventListener("click",()=>halShow(false));
document.getElementById("halModal").addEventListener("click",e=>{if(e.target.id==="halModal")halShow(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&halOpen)halShow(false)});
setInterval(()=>{if(halOpen){const c=document.getElementById("halCount");if(c)c.innerHTML=halCountdown(curLang)}},1000);
</script>
</body>
